<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基本情報技術者 暗記フラッシュカード</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #4a90e2;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 90%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .setup-screen input {
            width: 80px;
            padding: 10px;
            font-size: 1.2rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #357abd;
        }
        .card-screen {
            display: none;
        }
        .progress {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-bottom: 15px;
        }
        .timer-bar {
            width: 100%;
            height: 6px;
            background-color: #eee;
            border-radius: 3px;
            margin-bottom: 30px;
            overflow: hidden;
        }
        .timer-progress {
            height: 100%;
            background-color: #2ecc71;
            width: 100%;
        }
        .card-box {
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid #eef2f5;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: #fafbfc;
        }
        .label {
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            padding: 4px 10px;
            border-radius: 20px;
        }
        .label.description {
            background-color: #ffeaa7;
            color: #d63031;
        }
        .label.term {
            background-color: #dff9fb;
            color: #0984e3;
        }
        .content {
            font-size: 1.3rem;
            font-weight: 600;
            line-height: 1.6;
        }
        .control-btns {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }
        .btn-secondary {
            background-color: #95a5a6;
        }
        .btn-secondary:hover {
            background-color: #7f8c8d;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="setupScreen" class="setup-screen">
        <h1>基本情報技術者 フラッシュカード</h1>
        <p>カードの切り替え秒数を指定してください：</p>
        <input type="number" id="intervalInput" value="5" min="1" max="60"> 秒<br>
        <button class="btn" onclick="startFlashcard()">スタート</button>
    </div>

    <div id="cardScreen" class="card-screen">
        <div class="progress" id="progressText">0 / 0</div>
        <div class="timer-bar">
            <div id="timerProgress" class="timer-progress"></div>
        </div>
        <div class="card-box">
            <div id="cardLabel" class="label"></div>
            <div id="cardContent" class="content"></div>
        </div>
        <div class="control-btns">
            <button class="btn btn-secondary" onclick="pauseOrResume()" id="pauseBtn">一時停止</button>
            <button class="btn btn-secondary" onclick="stopFlashcard()">終了</button>
        </div>
    </div>
</div>

<script>
    // エラーが起きにくい配列形式にデータを調整しました
    const cards = [
        { term: "固定小数点数", desc: "[用語例] 数値の表現において、小数点の位置を固定して扱う形式。" },
        { term: "単精度浮動小数点数", desc: "[用語例] 数値の表現において、通常の精度（32ビットなど）で小数を扱う形式。" },
        { term: "倍精度浮動小数点数", desc: "[用語例] 数値の表現において、単精度の2倍の精度（64ビットなど）で小数を扱う形式。" },
        { term: "仮数", desc: "[用語例] 浮動小数点数において、数値の有効数字を表す部分。" },
        { term: "指数", desc: "[用語例] 浮動小数点数において、桁の大きさを表す部分。" },
        { term: "BCD", desc: "[用語例] Binary Coded Decimalの略。2進数の4ビットを用いて10進数の1桁を表現する手法（2進化10進）。" },
        { term: "パック 10進数", desc: "[用語例] 1つのバイトに10進数の数値を2桁ずつ詰め込んで表現する形式。" },
        { term: "論理シフト", desc: "[用語例] 符号を考慮せず、ビット列をそのまま左右にずらすシフト演算。" },
        { term: "算術シフト", desc: "[用語例] 符号ビット（最左位ビット）を固定したまま、数値部分のビット列を左右にずらすシフト演算。" },
        { term: "桁落ち", desc: "[用語例] 値がほぼ等しい2つの浮動小数点数の差を計算したとき、有効数字が大きく減少することによって生じる誤差。" },
        { term: "情報落ち", desc: "[用語例] 絶対値の非常に大きな浮動小数点数と、絶対値の非常に小さな浮動小数点数の加減算を行ったとき、小さな数値が計算結果に反映されなくなることによって生じる誤差。" },
        { term: "オーバーフロー (あふれ)", desc: "[用語例] 演算結果が、表現可能な数値の最大範囲を超えてしまう状態。" },
        { term: "アンダーフロー", desc: "[用語例] 演算結果の絶対値が小さすぎて、表現可能な最小の範囲を下回ってしまう状態。" },
        { term: "単精度", desc: "[用語例] コンピュータの算術演算における標準的なデータ型の精度。" },
        { term: "倍精度", desc: "[用語例] コンピュータの算術演算における、単精度の2倍のビット数を持つデータ型の精度。" },
        { term: "和集合", desc: "[用語例] 複数の集合の少なくともいずれか1つに含まれている要素全体からなる集合。" },
        { term: "積集合", desc: "[用語例] 複数の集合のすべてに共通して含まれている要素全体からなる集合。" },
        { term: "補集合", desc: "[用語例] 全体集合の中で、ある特定の集合に含まれない要素全体からなる集合。" },
        { term: "部分集合", desc: "[用語例] ある集合の要素が、もう一方の集合にすべて含まれているときの一方の集合。" },
        { term: "真", desc: "[用語例] 命題や論理式において、内容が正しいことを示す論理値。" },
        { term: "偽", desc: "[用語例] 命題や論理式において、内容が正しくないことを示す論理値。" },
        { term: "命題論理", desc: "[用語例] 「真」または「偽」の客観的な値を持つ文章（命題）を組み合わせて論理を展開する手法。" },
        { term: "否定", desc: "[用語例] 与えられた論理値の真偽を反転させる論理演算。" },
        { term: "論理和", desc: "[用語例] 複数の命題のいずれか1つでも真であれば真となる論理演算。" },
        { term: "論理積", desc: "[用語例] 複数の命題のすべてが真であるときのみ真となる論理演算。" },
        { term: "排他的論理和", desc: "[用語例] 2つの入力値の真偽が異なるときに真、同じときに偽となる論理演算。" },
        { term: "否定論理和", desc: "[用語例] 論理和（OR）の結果を反転させた（NOTした）論理演算。" },
        { term: "否定論理積", desc: "[用語例] 論理積（AND）の結果を反転させた（NOTした）論理演算。" },
        { term: "論理関数", desc: "[用語例] 1つ以上の論理変数を入力とし、論理値を返す関数。" },
        { term: "分配", desc: "[用語例] 規則的に A・(B＋C)＝(A・B)＋(A・C) のように展開できる論理演算の基本法則。" },
        { term: "階乗", desc: "[用語例] 1からある数までのすべての整数を掛け合わせたもの。確率や組合せの計算で用いられる。" },
        { term: "加法定理", desc: "[用語例] 互いに同時に起こらない事象において、それらのいずれかが起こる確率を各確率の和として求める定理。" },
        { term: "乗法定理", desc: "[用語例] 2つの事象が連続して、または同時に起こる確率を、条件付き確率を用いて求める定理。" },
        { term: "同時確率", desc: "[用語例] 2つ以上の事象が同時に発生する確率。" },
        { term: "条件付き確率", desc: "[用語例] ある事象Aが起こったという条件のもとで、別の事象Bが起こる確率。" },
        { term: "ベイズの定理", desc: "[用語例] ある事象が発生した後に、その原因が特定の事象である確率（事後確率）を求めるための定理。" },
        { term: "ポアソン分布", desc: "[用語例] 一定の時間や空間のなかで、めったに起こらないランダムな事象が発生する回数を表す確率分布。" },
        { term: "ベルヌーイ分布", desc: "[用語例] 結果が「成功」か「失敗」のいずれか2通りしかない試行（ベルヌーイ試行）を1回行ったときの確率分布。" },
        { term: "二項分布", desc: "[用語例] 結果が2通りしかない試行を独立に複数回繰り返したとき、ある結果が起こる回数の確率分布。" },
        { term: "正規分布", desc: "[用語例] 左右対称の吊り鐘型の形状をした、統計学で最も代表的な連続確率分布。" },
        { term: "指数分布", desc: "[用語例] 次にランダムな事象が起こるまでの時間間隔などを表す連続確率分布。" },
        { term: "中央値(メジアン)", desc: "[用語例] データを大きさの順に並べたときに、ちょうど中央に位置する値（代表値の1つ）。" },
        { term: "最頻値 (モード)", desc: "[用語例] データの中で最も頻繁に現れる値（代表値の1つ）。" },
        { term: "平均値", desc: "[用語例] データの総和をデータの個数で割って得られる値（代表値の1つ）。" },
        { term: "標準偏差", desc: "[用語例] データのばらつき度合いを表す指標で、分散の正の平方根。" },
        { term: "分散", desc: "[用語例] データのばらつき度合いを表す指標で、各データの値と平均値との差の2乗の平均。" },
        { term: "歪度", desc: "[用語例] データの分布が左右対称からどれだけ歪んでいるか（傾いているか）を表す統計量。" },
        { term: "尖度", desc: "[用語例] データの分布が正規分布と比べて、どれだけ尖っているか（中心に集中しているか）を表す統計量。" },
        { term: "相関係数", desc: "[用語例] 2つの変数の間にある線形な相関関係の強さを -1 から 1 の範囲で表す指標。" },
        { term: "回帰分析", desc: "[用語例] 1つの変数（目的変数）の変動を、他の変数（説明変数）によって説明・予測するための統計手法。" },
        { term: "単回帰分析", desc: "[用語例] 1つの説明変数を用いて目的変数を予測・分析する回帰分析の手法。" },
        { term: "重回帰分析", desc: "[用語例] 複数の説明変数を用いて目的変数を予測・分析する回帰分析の手法。" },
        { term: "ロジスティック回帰分析", desc: "[用語例] あるイベントが発生する確率を算出し、主に2つのグループ（2値）への分類を行う回帰モデル。" },
        { term: "相関分析", desc: "[用語例] 2つの変数間の関係（相関）を調査・分析する手法。" },
        { term: "主成分分析", desc: "[用語例] 多数の変数を持つデータから、情報の損失をできるだけ抑えつつ、少数の合成変数（主成分）に要約する次元削減手法。" },
        { term: "因子分析", desc: "[用語例] 多くの観測データに共通して影響を与えている、目に見えない潜在的な要因（因子）を導き出す手法。" },
        { term: "相関と因果", desc: "[用語例] 2つの事象が単に連動して変化している関係（相関）と、一方が原因で他方が結果となっている関係（因果）の違いを表す概念。" },
        { term: "疑似相関", desc: "[用語例] 2つの変数に因果関係がないにもかかわらず、第3の共通因子の影響によってあたかも相関関係があるように見える現象。" },
        { term: "説明変数", desc: "[用語例] 回帰分析などにおいて、結果（目的変数）を予測または説明するために用いられる原因側の変数。" },
        { term: "目的変数", desc: "[用語例] 回帰分析などにおいて、予測や説明の対象となる結果側の変数。" },
        { term: "名義尺度", desc: "[用語例] 分類や識別のためだけに用いられる、大小関係のないデータの尺度。" },
        { term: "順序尺度", desc: "[用語例] 順位や階級など、項目間の大小・優劣の順序に意味があるデータの尺度。" },
        { term: "間隔尺度", desc: "[用語例] 目盛の間隔が等間隔であり、差の計算に意味があるデータの尺度（例：温度など）。" },
        { term: "比例尺度", desc: "[用語例] 原点（ゼロ）が絶対的な意味を持ち、比率の計算にも意味があるデータの尺度（例：長さ、重量など）。" },
        { term: "点推定", desc: "[用語例] 標本から母集団の特性（母数）を1つの数値として具体的に推測すること。" },
        { term: "区間推定", desc: "[用語例] 標本をもとに、母集団の特性（母数）が特定の確率（信頼度）で含まれる範囲を幅を持たせて推測すること。" },
        { term: "尤度", desc: "[用語例] あるモデルや仮説のもとで、観測されたデータが実際に得られる確率（もっともらしさ）。" },
        { term: "最尤推定", desc: "[用語例] 観測データが与えられたとき、そのデータが得られる確率（尤度）が最大となるようにモデルのパラメータを推定する手法。" },
        { term: "対立仮説", desc: "[用語例] 仮説検定において、本来証明したい（帰無仮説が棄却されたときに採択される）仮説。" },
        { term: "帰無仮説", desc: "[用語例] 仮説検定において、否定される（無に帰される）ことを前提として立てる最初の仮説。" },
        { term: "有意水準", desc: "[用語例] 仮説検定において、帰無仮説を棄却するかどうかを判断する基準となる確率（一般に5%や1%）。" },
        { term: "p値(有意確率)", desc: "[用語例] 帰無仮説が正しいとしたとき、観測されたデータ（またはそれ以上に極端なデータ）が得られる確率。" },
        { term: "棄却域", desc: "[用語例] 仮説検定において、統計量がこの範囲に入れば帰無仮説を誤りとして捨てる（棄却する）領域。" },
        { term: "第1種の誤り", desc: "[用語例] 仮説検定において、本当は正しい帰無仮説を誤って棄却してしまう誤り。" },
        { term: "第2種の誤り", desc: "[用語例] 仮説検定において、本当は誤っている帰無仮説を誤って採択（見過ごし）してしまう誤り。" },
        { term: "検出力(検定力)", desc: "[用語例] 本当は誤っている帰無仮説を、正しく見抜いて棄却できる確率。" },
        { term: "線形代数", desc: "[用語例] ベクトル空間や行列の性質、線形写像などを扱う数学の分野。" },
        { term: "スカラ", desc: "[用語例] 大きさのみを持ち、方向を持たない量。" },
        { term: "ベクトル", desc: "[用語例] 大きさと方向を同時に持つ量、または数値の並び。" },
        { term: "固有値", desc: "[用語例] 行列にあるベクトルを掛けた結果が、元のベクトルの定数倍になるときの、その定数（倍率）。" },
        { term: "固有ベクトル", desc: "[用語例] 行列による線形変換によって、方向が変わらずに大きさだけが定数倍（固有値倍）になる非ゼロのベクトル。" },
        { term: "行列", desc: "[用語例] 数や記号を縦（行）と横（列）に格子状に並べたもの。" },
        { term: "逆行列", desc: "[用語例] ある行列に掛け合わせると、結果が単位行列になるような特殊な行列。" },
        { term: "単位行列", desc: "[用語例] 対角線上の成分がすべて1で、それ以外の成分がすべて0の正方行列。" },
        { term: "転置行列", desc: "[用語例] 元の行列の行と列を入れ替えて得られる行列。" },
        { term: "等差数列", desc: "[用語例] 隣り合う項の差が常に一定である数列。" },
        { term: "等比数列", desc: "[用語例] 隣り合う項の比が常に一定である数列。" },
        { term: "フィボナッチ数列", desc: "[用語例] 前の2つの項の和が次の項になるように作られる数列。" },
        { term: "対数", desc: "[用語例] ある数（底）を何乗すれば別の数になるかを表す数。" },
        { term: "三角関数", desc: "[用語例] 直角三角形の辺の比をもとに定義される関数（サイン、コサイン、タンジェント）。" },
        { term: "ニュートン法", desc: "[用語例] 方程式の近似解（数値解析の解）を求めるため、接線を利用して反復計算を行う代表的な手法。" },
        { term: "絶対誤差", desc: "[用語例] 真の値と測定値（または近似値）との差の絶対値。" },
        { term: "相対誤差", desc: "[用語例] 絶対誤差を真の値で割った値。誤差の割合を示す。" },
        { term: "丸め誤差", desc: "[用語例] 指定された有効桁数に収めるために、四捨五入や切り捨て、切り上げを行うことで生じる誤差。" },
        { term: "打切り誤差", desc: "[用語例] 無限に続く計算や処理（無限級数の計算など）を、途中の有限の段階で打ち切ることで生じる誤差。" },
        { term: "因数分解", desc: "[用語例] 数式を、いくつかのより単純な式（因数）の積の形に変形する代数処理の手法。" },
        { term: "微分", desc: "[用語例] 関数の各点における変化の割合や、接線の傾きを求める計算。" },
        { term: "積分", desc: "[用語例] 微分の逆の演算であり、曲線で囲まれた部分の面積や体積を求める計算。" },
        { term: "無向グラフ", desc: "[用語例] グラフ理論において、エッジ（辺）に方向（矢印）が設定されていないグラフ。" },
        { term: "有向グラフ", desc: "[用語例] グラフ理論において、エッジ（辺）に方向（矢印）が設定されているグラフ。" },
        { term: "サービス時間", desc: "[用語例] 待ち行列理論において、窓口（サーバー）が1人の顧客の処理に要する時間。" },
        { term: "待ち時間", desc: "[用語例] 待ち行列理論において、顧客が到着してからサービスが開始されるまでに待機する時間。" },
        { term: "到着間隔", desc: "[用語例] 待ち行列理論において、顧客が次々に到着する際の時間的な間隔。" },
        { term: "平均到着率", desc: "[用語例] 待ち行列理論において、単位時間あたりに平均して何人の顧客が到着するかを表す割合。" },
        { term: "平均サービス率", desc: "[用語例] 待ち行列理論において、窓口が単位時間あたりに平均して何人の顧客を処理できるかを表す割合。" },
        { term: "動的計画法", desc: "[用語例] 大きな問題を複数の小さな部分問題に分割し、その部分問題の解を記録・再利用しながら全体を最適化する計算手法。" },
        { term: "通信路符号化(誤り検出訂正)", desc: "[用語例] 符号理論において、データ伝送時のエラーを検出し、必要に応じて訂正できるように冗長なビットを付加する処理。" },
        { term: "ハフマン符号", desc: "[用語例] 出現頻度が高いデータには短いビット列を、低いデータには長いビット列を割り当てることでデータを圧縮する符号化方式。" },
        { term: "情報源符号化 (データ圧縮)", desc: "[用語例] 送信したいデータそのものの冗長性を排除し、効率的なビット列に変換する処理。" },
        { term: "ASCII コード", desc: "[用語例] 英数字や記号、制御文字などを表現するために広く用いられている7ビットの文字コード。" },
        { term: "EUC (Extended UNIX Code:拡張 UNIXコード)", desc: "[用語例] 主にUNIX系OSで日本語をはじめとする多言語文字を扱うために定義された文字コード。" },
        { term: "JISコード", desc: "[用語例] 日本産業規格（JIS）で定められた、日本語の漢字などを扱うための代表的な文字コード。" },
        { term: "シフトJISコード", desc: "[用語例] パソコンやMS-DOS環境などで広く使われてきた、JISコードをずらして効率よく配置した文字コード。" },
        { term: "Unicode", desc: "[用語例] 世界中のあらゆる言語の文字を一元的に扱うために作成された共通の文字コード規格。" },
        { term: "UCS", desc: "[用語例] Unicodeとほぼ同一の文字集合を定義した国際標準の文字コード規格。" },
        { term: "関係データベース", desc: "[用語例] データを2次元の表（テーブル）の形式で管理し、複数の表同士を関連付けて運用するデータベース。" },
        { term: "逆ポーランド表記法", desc: "[用語例] 数式の記述方法の1つで、演算子を被演算子（数値など）の後ろに配置する表記法（後置表記法）。" },
        { term: "時間計算量", desc: "[用語例] アルゴリズムの実行効率（計算量）を評価する指標で、入力データ量に対してどれだけの処理ステップ（時間）が必要かを表す。" },
        { term: "エキスパートシステム", desc: "[用語例] 特定の専門分野における知識（知識ベース）と推論のための仕組み（推論エンジン）をコンピュータに組み込み、専門家のように判断・支援させるAIシステム。" },
        { term: "知識ベース", desc: "[用語例] エキスパートシステムにおいて、専門家から集めたルールや事実をコンピュータが利用できる形式で蓄積したデータベース。" },
        { term: "推論エンジン", desc: "[用語例] 知識ベースに格納されたルールを基に、論理的な判断や結論を導き出すためのAIの処理機構。" },
        { term: "汎化", desc: "[用語例] 個別の事例やデータから共通の性質を抽出し、まだ見ぬ未知の事例にも対応できるように一般的な概念に拡張すること。" },
        { term: "教師あり学習", desc: "[用語例] 機械学習の手法の1つで、入力データとそれに対応する正しい「正解ラベル」をセットで与えて、予測や分類を学習させる手法（回帰、分類など）。" },
        { term: "教師なし学習", desc: "[用語例] 機械学習の手法の1つで、正解ラベルを与えずにデータそのものの構造や特徴を分析し、似たもの同士をグループ化などする手法（クラスタリング、次元削減など）。" },
        { term: "強化学習", desc: "[用語例] 機械学習の手法の1つで、エージェントが環境の中で行動を選択し、得られる「報酬」が最大化するように行動の選択基準を試行錯誤しながら学習する手法。" },
        { term: "線形回帰", desc: "[用語例] 機械学習の教師あり学習の手法の1つで、説明変数と目的変数の関係を直線（線形）の式として表し、数値を予測する手法。" },
        { term: "ロジスティック回帰", desc: "[用語例] 機械学習の手法の1つで、あるイベントが発生する確率を算出し、主に2つのグループ（2値）への分類を行う確率的な回帰モデル。" },
        { term: "決定木", desc: "[用語例] データを条件分岐に基づいてツリー（木）構造に分割していき、最終的な分類や数値の予測を行う機械学習の手法。" },
        { term: "ランダムフォレスト", desc: "[用語例] 多数の決定木をランダムに作成し、それぞれの予測結果を集計（多数決など）して最終的な結論を出すアンサンブル学習手法。" },
        { term: "サポートベクトルマシン (SVM)", desc: "[用語例] データを2つのクラスに分類するための最適な境界線（マージンが最大となる決定境界）を見つけ出す強力な機械学習の手法。" },
        { term: "学習(訓練) データ", desc: "[用語例] 機械学習モデルにパターンやルールを覚えさせる（学習させる）ために最初に使用するデータ。" },
        { term: "検証データ", desc: "[用語例] 機械学習の学習過程において、過学習を防ぐためにモデルの精度を途中で評価したり、パラメータを調整したりするために用いるデータ。" },
        { term: "テストデータ", desc: "[用語例] 最終的に学習・調整が完了した機械学習モデルが、実用に耐えうる未知のデータに正しく対応できるかを測定・評価するためのデータ。" },
        { term: "汎化性能", desc: "[用語例] 学習に使用していない未知の新しいデータに対して、機械学習モデルがどれだけ正しく予測や分類を行えるかという能力。" },
        { term: "過学習", desc: "[用語例] 機械学習モデルが訓練データに過剰に適合しすぎてしまい、未知のデータに対する予測精度（汎化性能）が著しく低下してしまう現象。" },
        { term: "交差検証", desc: "[用語例] データをいくつかのグループに分割し、学習と検証の役割を交代しながら複数回テストを繰り返すことで、モデルの評価をより確実にする検証手法。" },
        { term: "ホールドアウト検証", desc: "[用語例] 手元のデータを単純に「学習用」と「検証・テスト用」の2つに分割し、一方を学習に、他方を性能評価に用いる最も基本的な検証手法。" },
        { term: "ROC曲線", desc: "[用語例] 分類モデルの性能を視覚的に評価するためのグラフで、偽陽性率を横軸、真陽性率を縦軸に取って描かれる曲線。" },
        { term: "ニューラルネットワーク", desc: "[用語例] 人間の脳の神経細胞（ニューロン）の仕組みを模した数理モデルで、ディープラーニングの基礎となる構造。" },
        { term: "多層パーセプトロン", desc: "[用語例] 入力層、隠れ層（中間層）、出力層からなる複数の層を積み重ねた、順伝播型の代表的なニューラルネットワーク。" },
        { term: "バックプロパゲーション (誤差逆伝播法)", desc: "[用語例] 出力結果と正解との誤差を後ろの層から前の層へと逆向きに伝えていき、各ニューロンの重みやバイアスを効率よく修正・学習させるアルゴリズム。" },
        { term: "勾配消失問題", desc: "[用語例] ニューラルネットワークの層が深くなるにつれて、バックプロパゲーションでの誤差の勾配が途中途中極めて小さくなり、前の層の学習が進まなくなる問題。" },
        { term: "活性化関数", desc: "[用語例] ニューロンへの入力の総和を非線形な出力に変換する関数。ネットワークに複雑な表現力を持たせる役割を果たす。" },
        { term: "事前学習", desc: "[用語例] 特定のタスクを学習させる前に、大量のデータを用いてモデルにあらかじめ基礎的な特徴や言語の構造を学習させておくこと。" },
        { term: "ファイチューニング", desc: "[用語例] すでに大量のデータで事前学習された既存のモデルに対し、特定の目的や業務に合わせた追加データを少量の学習で適合させる手法。" },
        { term: "転移学習", desc: "[用語例] ある領域やタスクで学習した知識や学習済みのネットワークを、別の新しい関連するタスクの学習に再利用・応用する手法。" },
        { term: "畳み込みニューラルネットワーク（CNN）", desc: "[用語例] 画像の局所的な特徴を抽出する「畳み込み層」を持ち、主に画像認識や動画認識の分野で高い性能を発揮するネットワーク構造。" },
        { term: "リカレントニューラルネットワーク（RNN）", desc: "[用語例] 内部に循環する構造を持ち、時系列データや自然言語などの「前の状態が後ろに影響するデータ」を処理するのに適したネットワーク構造。" },
        { term: "生成モデル", desc: "[用語例] 訓練データの確率分布を学習し、それと類似した新しい未知のデータ（文章、画像など）を新しく作り出すことができるモデル。" },
        { term: "敵対的生成ネットワーク（GAN）", desc: "[用語例] データを生成する「生成器（Generator）」と、それが本物か偽物かを識別する「識別器（Discriminator）」の2つを競い合わせて精度を高める生成モデル。" },
        { term: "基盤モデル", desc: "[用語例] 膨大なデータを用いて事前に超大規模な学習を行っており、適切な微調整やプロンプトによって様々な下流タスク（文章生成、画像認識など）に柔軟に応用できる大規模なAIモデル。" },
        { term: "拡散モデル", desc: "[用語例] 画像に徐々にノイズを加えていく過程（順プロセス）を逆転させ、ノイズから元の鮮明な画像を復元していくことで高精度な画像を生成するAIモデル。" },
        { term: "言語モデル", desc: "[用語例] 単語の並びに確率を割り当て、ある文章の次にどのような単語が続くのが自然であるかを予測する数理モデル。" },
        { term: "大規模言語モデル（LLM）", desc: "[用語例] 膨大なテキストデータを学習させ、パラメータ数を極めて大規模に拡大した言語モデル。高度な自然言語の理解や文章生成を可能とする。" },
        { term: "自己教師あり学習", desc: "[用語例] 人手による正解ラベルを与えず、データの一部を隠してそれを予測させるなど、データ自身から自動的に正解を作って学習を行う手法。" },
        { term: "プロンプトエンジニアリング", desc: "[用語例] 大規模言語モデル（LLM）などから、目的とする最適な出力（回答や画像）を引き出すために、入力する指示文（プロンプト）の書き方を工夫・設計する技術。" },
        { term: "中間言語", desc: "[用語例] コンパイラ理論において、ソースプログラムを解析した後に、最終的なターゲット言語へ変換する手前で生成される扱いやすい形式の言語。" },
        { term: "目的プログラム", desc: "[用語例] コンパイラなどによって、元のソースプログラムから翻訳・出力された、機械が理解可能な（または実行に近い）形式のプログラム。" },
        { term: "形式言語", desc: "[用語例] 構文規則（文法）が完全に厳密に定義された言語。プログラム言語の定義に用いられる。" },
        { term: "オートマトン", desc: "[用語例] 文字列などの入力を順に受け取り、定義された規則に従って状態を遷移させていく抽象的な自動機械のモデル。" },
        { term: "手続型言語", desc: "[用語例] 処理の手順（命令や手続き）を順次記述していくスタイルのプログラム言語（C言語、COBOLなど）。" },
        { term: "関数型言語", desc: "[用語例] 処理を関数の組み合わせや評価として記述するプログラム言語（Lisp, Haskellなど）。" },
        { term: "論理型言語", desc: "[用語例] 事実と論理規則（関係性）を定義し、コンピュータに推論させることで結果を得るプログラム言語（Prologなど）。" },
        { term: "オブジェクト指向言語", desc: "[用語例] データとそれを操作する手続きを「オブジェクト」として一体化し、それらの相互作用としてプログラムを構成する言語（Java、C++など）。" },
        { term: "単方向", desc: "[用語例] 伝送理論において、データの一方通行の伝送しか行えない通信方式。" },
        { term: "半二重", desc: "[用語例] 伝送理論において、双方向の通信が可能であるが、同時には送受信できず交互に通信を行う方式。" },
        { term: "全二重", desc: "[用語例] 伝送理論において、送信と受信を同時に行うことができる双方向の通信方式。" },
        { term: "AM（Amplitude Modulation：振幅変調）", desc: "[用語例] 搬送波の「振幅（強さ）」を変化させてアナログ信号を伝える変調方式。" },
        { term: "FM（Frequency Modulation：周波数変調）", desc: "[用語例] 搬送波の「周波数」を変化させてアナログ信号を伝える変調方式。" },
        { term: "PM（Phase Modulation：位相変調）", desc: "[用語例] 搬送波の「位相（波のタイミング）」を変化させてアナログ信号を伝える変調方式。" },
        { term: "PCM（Pulse Code Modulation：パルス符号変調）", desc: "[用語例] アナログ音声信号などを定期的にサンプリング（標本化・量子化・符号化）してデジタルデータに変換する方式。" },
        { term: "FDM（Frequency Division Multiplexing：周波数分割多重）", desc: "[用語例] 1つの伝送路に異なる周波数の複数の信号を同時に流す多重化方式。" },
        { term: "TDM（Time Division Multiplexing：時分割多重）", desc: "[用語例] 極めて短い時間ごとに伝送路の利用枠を順番に割り当てる多重化方式。" },
        { term: "CRC", desc: "[用語例] 巡回冗長検査。データを多項式で割り算した余り（チェックデータ）を付加し、バースト誤りなどを高精度に検出する誤り検出方式。" },
        { term: "ハミング符号", desc: "[用語例] データに特定の冗長ビットを付加することで、データの通信時に発生した1ビットの誤りを検出し、かつ自動的に訂正できる符号。" },
        { term: "パリティチェック", desc: "[用語例] 最も基本的な誤り検出方式。データのビット列に含まれる「1」の個数が奇数か偶数かを示す1ビット（パリティビット）を付加してチェックを行う。" },
        { term: "ECC", desc: "[用語例] Error Correction Codeの略。誤り訂正符号の総称。データの誤りを検出し、自動で正しい値に直す仕組み。" },
        { term: "チェックサム", desc: "[用語例] 送信するデータの合計値を計算してデータの末尾に付加し、受信側でも同様の合計値を算出・比較してデータに誤りがないかを確認する簡便な手法。" },
        { term: "ビット同期", desc: "[用語例] 送受信側で1ビットずつのタイミング（クロック）を一致させる信号同期方式。" },
        { term: "キャラクター同期", desc: "[用語例] 伝送されるデータの1文字（キャラクター）単位でタイミングを合わせる同期方式。" },
        { term: "フラグ同期", desc: "[用語例] データの前後を「特定のビットパターン（フラグ）」で挟むことで、データの区切り（フレーム）を識別する同期方式。" },
        { term: "調歩同期", desc: "[用語例] データの1文字ごとに、先頭に「スタートビット」、末尾に「ストップビット」を付加して送受信のタイミングをその都度合わせる同期方式。" },
        { term: "スタートビット", desc: "[用語例] 調歩同期方式において、文字データの送信開始を知らせるためのビット。" },
        { term: "ストップビット", desc: "[用語例] 調歩同期方式において、文字データの送信終了を知らせるためのビット。" },
        { term: "SYN 同期", desc: "[用語例] 送信データの先頭に特定の同期用文字「SYN」を配置し、連続してデータを送信する同期方式。" },
        { term: "フレーム同期", desc: "[用語例] データのまとまりである「フレーム」の開始と終了のタイミングを正確に合わせる同期方式。" },
        { term: "フィルタリング", desc: "[用語例] 信号処理において、アナログ波形から特定の周波数成分（雑音など）を除去または抽出し、必要な波形を取り出すこと。" },
        { term: "D/A 変換", desc: "[用語例] コンピュータが扱うデジタル信号を、現実世界の電圧などのアナログ信号に変換する処理。" },
        { term: "A/D 変換", desc: "[用語例] 現実世界のアナログ信号（音声、光、電気信号など）を、コンピュータが処理できるデジタル信号に変換する処理。" },
        { term: "リアルタイム OS", desc: "[用語例] 機器の制御などにおいて、あらかじめ定められた時間内（デッドライン）に確実に処理を完了・応答することを最優先に設計されたオペレーティングシステム。" },
        { term: "オープンループ", desc: "[用語例] 制御理論において、出力された結果を測定して入力側に戻す（フィードバックする）ことをせず、あらかじめ決められた命令通りに一方通行で動作を制御する方式。" },
        { term: "応答特性", desc: "[用語例] 制御システムに指示を与えたとき、対象がどれだけ速く、かつ正確に反応するかを表す動作特性。" },
        { term: "制御安定性", desc: "[用語例] 制御システムが外部の乱れ（外乱）を受けても、異常な振動や暴走を起こさず、時間とともに目的の状態に落ち着く（安定する）度合い。" },
        { term: "光学センサー", desc: "[用語例] 光を検知して電気信号に変換するセンサー。" },
        { term: "赤外線センサー", desc: "[用語例] 目に見えない赤外線を感知し、物体の接近や温度の変化を検知するセンサー。" },
        { term: "磁気センサー", desc: "[用語例] 磁界の強さや方向を検知するセンサー。" },
        { term: "加速度センサー", desc: "[用語例] 単位時間あたりの速度の変化（加速度）を測定するセンサー。スマホの傾き検知などに用いられる。" },
        { term: "ジャイロセンサー", desc: "[用語例] 物体が回転する速度（角速度）を測定するセンサー。位置や姿勢の制御に用いられる。" },
        { term: "超音波センサー", desc: "[用語例] 人間の耳には聞こえない高い周波数の音波を放ち、それが物体に反射して戻ってくる時間から距離を測定するセンサー。" },
        { term: "温度センサー", desc: "[用語例] 周囲の熱（温度）を感知して計測するセンサー。" },
        { term: "湿度センサー", desc: "[用語例] 空気中に含まれる水蒸気の量（湿度）を計測するセンサー。" },
        { term: "圧力センサー", desc: "[用語例] 気体や液体、物体にかかる力（圧力）の大きさを感知して電気信号に変えるセンサー。" },
        { term: "ひずみゲージ", desc: "[用語例] 物体に力が加わって変形する（ひずみが生じる）際の、ごくわずかな電気抵抗の変化を測定するセンサー。" },
        { term: "サーミスタ", desc: "[用語例] 温度の変化に応じて電気抵抗が大きく変化する性質を持った半導体素子。温度センサーとして広く利用される。" },
        { term: "ホール素子", desc: "[用語例] 磁界が加わるとその強さに比例した電圧が発生する現象（ホール効果）を利用した、磁気を検知する素子。" },
        { term: "モーター", desc: "[用語例] 電気エネルギーを回転運動などの機械的な動きに変換するアクチュエーター。" },
        { term: "油圧シリンダ", desc: "[用語例] 油の圧力（油圧）を利用して、ピストンを直線的に動かす強力な駆動装置（アクチュエーター）。" },
        { term: "空気圧シリンダ", desc: "[用語例] 圧縮空気の圧力（空気圧）を利用して、ピストンを直線的に動かす駆動装置（アクチュエーター）。" }
    ];

    // 配列のシャッフル関数
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    let currentIndex = 0;
    let isShowingTerm = false; // false:解説(右側) -> true:用語(左側)
    let intervalTime = 5000;
    let timerId = null;
    let animationId = null;
    let startTime = 0;
    let pausedTime = 0;
    let isPaused = false;

    const setupScreen = document.getElementById('setupScreen');
    const cardScreen = document.getElementById('cardScreen');
    const intervalInput = document.getElementById('intervalInput');
    const progressText = document.getElementById('progressText');
    const timerProgress = document.getElementById('timerProgress');
    const cardLabel = document.getElementById('cardLabel');
    const cardContent = document.getElementById('cardContent');
    const pauseBtn = document.getElementById('pauseBtn');

    function startFlashcard() {
        const sec = parseInt(intervalInput.value, 10) || 5;
        intervalTime = sec * 1000;

        shuffle(cards); // 起動時に毎回ランダムに並び替え
        currentIndex = 0;
        isShowingTerm = false;
        isPaused = false;
        pauseBtn.innerText = "一時停止";

        setupScreen.style.display = 'none';
        cardScreen.style.display = 'block';

        showCard();
    }

    function showCard() {
        if (currentIndex >= cards.length) {
            alert('すべてのカードが終了しました！');
            stopFlashcard();
            return;
        }

        progressText.innerText = `${currentIndex + 1} / ${cards.length}`;
        const currentCard = cards[currentIndex];

        if (!isShowingTerm) {
            // 解説（右側）を先に表示
            cardLabel.innerText = "解説（これの用語は何？）";
            cardLabel.className = "label description";
            cardContent.innerText = currentCard.desc;
        } else {
            // 用語（左側）を表示
            cardLabel.innerText = "答え（用語）";
            cardLabel.className = "label term";
            cardContent.innerText = currentCard.term;
        }

        startTimer();
    }

    function startTimer() {
        cancelAnimationFrame(animationId);
        clearTimeout(timerId);
        
        startTime = performance.now();
        if (isPaused) {
            startTime -= pausedTime;
            isPaused = false;
        } else {
            pausedTime = 0;
        }

        function updateProgressBar(now) {
            const elapsed = now - startTime;
            const remainingRatio = Math.max(0, 100 - (elapsed / intervalTime) * 100);
            timerProgress.style.width = remainingRatio + '%';

            if (elapsed < intervalTime) {
                animationId = requestAnimationFrame(updateProgressBar);
            }
        }
        animationId = requestAnimationFrame(updateProgressBar);

        timerId = setTimeout(() => {
            if (!isShowingTerm) {
                isShowingTerm = true;
            } else {
                isShowingTerm = false;
                currentIndex++;
            }
            showCard();
        }, intervalTime);
    }

    function pauseOrResume() {
        if (!isPaused) {
            // 一時停止
            isPaused = true;
            cancelAnimationFrame(animationId);
            clearTimeout(timerId);
            pausedTime = performance.now() - startTime;
            pauseBtn.innerText = "再開";
        } else {
            // 再開
            isPaused = false;
            pauseBtn.innerText = "一時停止";
            startTimer();
        }
    }

    function stopFlashcard() {
        cancelAnimationFrame(animationId);
        clearTimeout(timerId);
        setupScreen.style.display = 'block';
        cardScreen.style.display = 'none';
    }
</script>

</body>
</html>
